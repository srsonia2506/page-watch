name: check

on:
  schedule:
    - cron: "17 * * * *"    # hourly backup; cron-job.org triggers the 5-min checks
  workflow_dispatch:         # lets you hit "Run workflow" manually to test
    inputs:
      test_ping:
        description: "Send a test notification"
        type: boolean
        default: false

permissions:
  contents: write            # to save state.json so you're pinged once per opening, not every 5 min

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PAGE_URL: ${{ secrets.PAGE_URL }}
          BUY_URL: ${{ secrets.BUY_URL }}
          WATCH: ${{ secrets.WATCH }}
          TEST_PING: ${{ inputs.test_ping }}
        run: python check.py
      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
